name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          MAJOR="${VERSION%%.*}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major=${MAJOR}" >> "${GITHUB_OUTPUT}"

      - name: Find previous semver tag
        id: prev_tag
        run: |
          # Get all semver tags sorted by version, excluding major-only tags like v2
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | grep -B1 "^${CURRENT_TAG}$" | head -1)
          if [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            # This is the first release, no previous tag
            PREV_TAG=""
          fi
          echo "tag=${PREV_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Generate release body
        id: body
        env:
          PREV_TAG: ${{ steps.prev_tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"

          if [ -n "$PREV_TAG" ]; then
            BODY="**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${CURRENT_TAG}"
          else
            BODY="**Full Changelog**: https://github.com/${REPO}/commits/${CURRENT_TAG}"
          fi

          # Use delimiter for multiline output
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          body: ${{ steps.body.outputs.body }}
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update major version tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAJOR_VERSION: v${{ steps.version.outputs.major }}
          FULL_VERSION: v${{ steps.version.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git tag -fa "$MAJOR_VERSION" -m "Update $MAJOR_VERSION to $FULL_VERSION"
          git push origin "$MAJOR_VERSION" --force
