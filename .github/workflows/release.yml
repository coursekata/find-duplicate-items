name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          MAJOR="${VERSION%%.*}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major=${MAJOR}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.4
        with:
          generate_release_notes: true
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update major version tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAJOR_VERSION: v${{ steps.version.outputs.major }}
          FULL_VERSION: v${{ steps.version.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git tag -fa "$MAJOR_VERSION" -m "Update $MAJOR_VERSION to $FULL_VERSION"
          git push origin "$MAJOR_VERSION" --force
