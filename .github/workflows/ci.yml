name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check (Biome)
        id: npm-check
        run: npm run check

      - name: Typecheck
        id: npm-typecheck
        run: npm run typecheck

      - name: Lint (Actions)
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Successful validation
        id: test-action--success
        uses: ./
        with:
          include: ./__tests__/fixtures/valid/*

      - name: Find duplicates
        id: test-action--errors
        uses: ./
        continue-on-error: true
        with:
          include: ./__tests__/fixtures/**

      # https://github.com/actions/github-script
      - name: Test that errors were found
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DUPLICATES: ${{ steps.test-action--errors.outputs.duplicates }}
        with:
          script: |
            const assert_equal = (value) => require("node:assert/strict").deepEqual(value, true)
            assert_equal(Object.keys(JSON.parse(process.env['DUPLICATES'])).length !== 0)
